name: Bug report
description: Report something that does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. For a security
        vulnerability, do not open a public issue: follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings > About, or the release tag you installed.
      placeholder: v0.x.x
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 7, Android 14
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: Install source
      options:
        - GitHub release APK
        - Obtainium
        - Google Play
        - Built from source
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what actually happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: calendar-setup
    attributes:
      label: Calendar setup (if relevant)
      description: >
        Local calendar, CalDAV via DAVx5, a Google account, etc. Do not
        include event titles, locations, or other personal data.
    validations:
      required: false
