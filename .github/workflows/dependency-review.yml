name: Dependency review

on:
  pull_request:
    branches: [main]

# `contents: read` is enough; the action only needs to read the dep
# graph and the PR diff. `pull-requests: write` would let it post a
# PR comment summary, but the action's failure already shows up as a
# check on the PR, and we prefer fewer bot-comment surfaces.
permissions:
  contents: read

concurrency:
  # See dependency-graph.yml: github.ref alone collides across event types.
  group: dependency-review-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review PR dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block merges that introduce a moderate-or-higher CVE.
          # Tighten to `low` if a CVE that matters slips through, or
          # loosen to `high` for grouped Dependabot PRs if fatigue
          # surfaces (handoff guidance).
          fail-on-severity: moderate
          # Whitelist of acceptable SPDX licenses. GPL-3.0-or-later is
          # Asala's own license; the permissives below are GPL-3.0
          # compatible. AGPL and other copyleft variants intentionally
          # fail closed: a new AGPL transitive needs an explicit ADR
          # conversation, not a silent accept.
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, GPL-3.0-or-later
          # A submitted snapshot lags GitHub's own indexing: the submission
          # API accepts it before the compare API this action reads can see
          # it (the dependency-graph workflow pins it to the head sha; the
          # base + head snapshots do get submitted). Retry rides out that
          # lag. Cap the wait at 15 min rather than the 60 min docs default:
          # CI here does not block merges, so on a slow-indexing day failing
          # fast as an advisory beats hanging for an hour or being cancelled
          # by a later push.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 900
          # `deny-packages` is empty for now. Add `pkg:maven/<group>/<artifact>@<version>`
          # entries when a known-broken-but-unupgradable dep surfaces,
          # with a comment naming the CVE and the ADR or issue that
          # documented the acceptance.
          deny-packages: ''
