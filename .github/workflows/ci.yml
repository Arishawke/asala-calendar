name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # gitleaks needs full history to scan it
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 17
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Lint, test, assemble, coverage
        # --continue: run all gates even if an early one fails, so a single
        # Spotless nit does not hide a real test failure (PR #19 review,
        # MODERATE). All reports upload as artifacts below regardless.
        # assembleRelease exercises R8 + resource-shrink (unsigned in CI, no
        # keystore) to catch shrink-only breakage before a release tag.
        run: ./gradlew spotlessCheck detekt lintDebug testDebugUnitTest koverXmlReport assembleDebug assembleRelease --continue --no-daemon --stacktrace

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload detekt report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: detekt-report
          path: app/build/reports/detekt/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Kover coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kover-report
          # Root aggregate is the canonical report; :app:koverXmlReport
          # is not invoked separately so the per-module file may not exist.
          path: build/reports/kover/report.xml
          if-no-files-found: ignore
          retention-days: 14
