name: Dependency graph

on:
  # Runs on every merge to main so the dependency graph reflects what
  # is actually shipping.
  push:
    branches: [main]
  # Also runs on every PR so dependency-review.yml has a snapshot to
  # compare against. dependency-review (on pull_request) looks up the
  # snapshot by the PR HEAD sha, but on a pull_request event the default
  # GITHUB_SHA is the synthetic merge commit, so the snapshot lands on
  # the wrong sha and review loops on "no snapshots found for the head
  # SHA" until its timeout. The submission step below pins the snapshot
  # to the head sha to fix that.
  pull_request:
    branches: [main]
  # Weekly refresh in case nothing merges that touches deps. Monday
  # 06:00 UTC aligns with Dependabot's weekly cadence so vulnerability
  # data and submitted graph stay in sync.
  schedule:
    - cron: '0 6 * * 1'
  # Manual trigger for after-the-fact graph rebuilds (e.g. after a
  # GitHub outage or a one-off dep change pushed directly).
  workflow_dispatch:

# `contents: write` is required so dependency-submission can post
# the resolved graph to the Dependency Submission API. No other scope
# needed: we are not editing files or commenting on PRs from this job.
permissions:
  contents: write

concurrency:
  # github.ref alone collides across event types (push vs pull_request vs
  # workflow_dispatch). Including event_name keeps the groups independent.
  group: dependency-graph-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    name: Submit dependency graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # On a PR, build the head commit (not the synthetic merge) so the
          # resolved graph matches the sha the snapshot is pinned to below.
          # Empty on push/schedule/dispatch, where checkout uses its default.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate and submit dependency graph
        # `cache-provider: basic` keeps us on the MIT-licensed cache
        # implementation. gradle/actions v6.0.0 extracted enhanced
        # caching into a closed-source library under Gradle's Terms
        # of Use; v6.1.0 added `basic` as the OSS escape hatch.
        # Asala is GPLv3, so we set this explicitly.
        # `dependency-graph-include-configurations` regex scopes the
        # submitted graph to the Gradle configurations that actually
        # ship in the APK. Without it, Gradle and AGP plugin internals
        # (Netty, BouncyCastle, jose4j, commons-lang3, etc.) land in
        # the graph and Dependabot raises alerts on build-tool CVEs
        # that are not in Asala's runtime. Same scope as PR #21's
        # OWASP Dependency-Check setup. Tracking upstream:
        # gradle/actions issue #815 may ship this scoping as a future
        # default for Android.
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        env:
          # The action has no input for the snapshot sha/ref; it reads these
          # env vars. On a PR, pin them to the head commit so dependency-review
          # (which looks up the head sha) finds the snapshot. On push to main
          # both fall through to the defaults, keeping the default-branch graph
          # correct.
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_REF: ${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}
        with:
          cache-provider: basic
          dependency-graph-include-configurations: '(debug|release)RuntimeClasspath'
